<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Victor Vectorizer</title>
<style>
:root{--bg:#f6f6f4;--fg:#1b1b1b;--card:#fff;--line:#d8d8d2;--acc:#2b59ff;--mut:#666}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--card:#1e1e1e;--line:#333;--acc:#7b97ff;--mut:#999}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{padding:16px;border-right:1px solid var(--line);background:var(--card);overflow:auto;max-height:100vh}
main{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h1{font-size:18px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 12px;font-size:12px}
label{display:block;margin:10px 0 2px;font-size:12px;color:var(--mut)}
label b{color:var(--fg);float:right;font-weight:500}
input[type=range]{width:100%}
select,button{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
button.p{background:var(--acc);color:#fff;border:0;margin-top:8px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.row label{margin:10px 0 0}
#drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--mut);cursor:pointer}
#drop.over{border-color:var(--acc)}
#view{position:relative;flex:1;min-height:360px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#8881 0 25%,transparent 0 50%) 0/20px 20px;touch-action:none}
#view>*{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
#svgwrap{clip-path:inset(0 0 0 50%)}
#bar{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--acc);cursor:ew-resize;z-index:2}
#stat{font-size:12px;color:var(--mut)}
@media(max-width:760px){body{grid-template-columns:1fr}aside{max-height:none;border:0}}
</style>
</head>
<body>
<aside>
  <h1>Victor</h1>
  <p class="sub">Raster → SVG, entirely in your browser. Rust/WASM, no upload.</p>
  <div id="drop">Drop, paste or click to choose an image</div>
  <input id="file" type="file" accept="image/*" hidden>
  <details id="advanced">
    <summary>Advanced</summary>
    <label>Preset</label>
    <select id="preset"></select>
    <div id="ctl"></div>
    <div class="row"><label><input type="checkbox" id="stacked" checked> stacked layers</label><label><input type="checkbox" id="spline" checked> curves</label></div>
    <div class="row"><label><input type="checkbox" id="seg"> AI subject separation</label></div>
    <div class="row"><label><input type="checkbox" id="refine" checked> AI refinement</label></div>
    <label>Refinement quality</label>
    <select id="quality"><option value="fast">Fast</option><option value="balanced" selected>Balanced</option><option value="max">Max</option></select>
  </details>
  <button class="p" id="dl" disabled>Download SVG</button>
  <button id="cp" disabled>Copy SVG</button>
</aside>
<main>
  <div id="view"><img id="src" alt=""><div id="svgwrap"></div><div id="bar"></div></div>
  <div id="stat">No image loaded.</div>
</main>
<script type="module">
import { CANDIDATES, chooseParams, toPixels } from "./auto.js";
const $ = s => document.querySelector(s);
const CTL = [
  ["maxdim","Max dimension px",256,4096,64,1536],
  ["smooth","Denoise passes",0,4,1,1],
  ["colorPrecision","Color precision",1,8,1,5],
  ["layerDifference","Layer difference",0,64,1,24],
  ["filterSpeckle","Speckle filter",0,32,1,8],
  ["cornerThreshold","Corner threshold °",0,180,5,60],
  ["lengthThreshold","Segment length",3.5,10,0.5,4],
  ["spliceThreshold","Splice threshold °",0,180,5,45],
  ["threshold","B&W threshold",0,255,1,128],
];
for (const [k,l,min,max,step,v] of CTL) {
  $("#ctl").insertAdjacentHTML("beforeend",
    `<label for="${k}">${l}<b id="${k}v">${v}</b></label><input type="range" id="${k}" min="${min}" max="${max}" step="${step}" value="${v}">`);
}
$("#preset").innerHTML = '<option value="auto" selected>Auto (best quality per byte)</option>' +
  Object.keys(CANDIDATES).map(n => `<option value="${n}">${n}</option>`).join("");
const manual = () => $("#preset").value !== "auto";
function setControls(p) {
  for (const [k] of CTL) if (k in p) { $("#"+k).value = p[k]; $("#"+k+"v").textContent = p[k]; }
  $("#stacked").checked = p.stacked; $("#spline").checked = p.spline; state.binary = p.binary;
}
$("#preset").onchange = () => { if (manual()) setControls(CANDIDATES[$("#preset").value]); schedule(); };

const state = {binary:false};
const pool = Array.from({length: Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2))}, () => {
  const w = new Worker("./worker.js", {type:"module"});
  w.pending = new Map(); w.busy = 0;
  w.onmessage = ({data}) => { const r = w.pending.get(data.id); w.pending.delete(data.id); w.busy--; data.error ? r.reject(new Error(data.error)) : r.resolve(data); };
  return w;
});
let jobId = 0;
function trace(rgba, width, height, params) {
  const w = pool.reduce((a, b) => (b.busy < a.busy ? b : a));
  const id = ++jobId; w.busy++;
  return new Promise((resolve, reject) => {
    w.pending.set(id, {resolve, reject});
    w.postMessage({id, rgba: rgba.buffer, width, height, params}, [rgba.buffer]);
  }).then(r => { trace.ms = r.ms; return r.svg; });
}

let src = null, runToken = 0, svgText = "", srcName = "image", timer = 0, fileBytes = 0;

function manualParams() {
  const v = k => +$("#"+k).value;
  return {binary:state.binary, stacked:$("#stacked").checked, spline:$("#spline").checked,
    filterSpeckle:v("filterSpeckle"), colorPrecision:v("colorPrecision"), layerDifference:v("layerDifference"),
    cornerThreshold:v("cornerThreshold"), lengthThreshold:v("lengthThreshold"), spliceThreshold:v("spliceThreshold"),
    pathPrecision:1, smooth:v("smooth"), threshold:v("threshold"), gradients:false};
}
function schedule(){ clearTimeout(timer); timer = setTimeout(run, 150); }

async function run(){
  if (!src) return;
  const token = ++runToken, t0 = performance.now();
  const max = +$("#maxdim").value, s = Math.min(1, max / Math.max(src.width, src.height));
  const w = Math.max(1, Math.round(src.width*s)), h = Math.max(1, Math.round(src.height*s));
  const QUALITY = {
    fast: { refineShapeIters: 6, refineIters: 60, refineMs: 1500, refineRounds: 2, refineDens: 0.06 },
    balanced: {},
    max: { refineShapeIters: 20, refineIters: 200, refineMs: 8000, refineRounds: 3, refinePrune: 0.3, refineDens: 0.25 }
  };
  let params, note = "", traced = null;
  try {
    if (!manual() && $("#seg").checked) {
      $("#stat").textContent = "Separating subject…";
      const { traceSegmented } = await import("./seg.js");
      const r = await traceSegmented(src, w, h, trace);
      if (token !== runToken) return;
      traced = r.svg;
      note = r.used === "segments" ? ` · subject ${(r.fraction*100).toFixed(0)}% (${r.subject}) over background (${r.background})` : ` · auto: ${r.choice} (separation not better)`;
    } else if (!manual()) {
      $("#stat").textContent = "Scoring candidates…";
      const ranked = await chooseParams(src, src.width, src.height, trace);
      if (token !== runToken) return;
      params = CANDIDATES[ranked[0].name];
      note = ` · auto: ${ranked[0].name} (${ranked.map(r => r.name + " " + r.score.toFixed(0)).join(", ")})`;
      setControls(params);
    } else params = manualParams();
    if (!traced) {
      $("#stat").textContent = "Tracing…";
      const px = await toPixels(src, w, h);
      traced = await trace(new Uint8Array(px.data), w, h, {...params, ...QUALITY[$("#quality").value], refine: $("#refine").checked});
    }
    const svg = traced;
    if (token !== runToken) return;
    svgText = svg.replace(/width="\d+" height="\d+"/, `width="${w}" height="${h}"`);
    $("#svgwrap").innerHTML = svgText;
    const el = $("#svgwrap svg"); el.removeAttribute("width"); el.removeAttribute("height");
    el.style.cssText = "position:absolute;inset:0;width:100%;height:100%";
    const paths = (svgText.match(/<path/g)||[]).length;
    $("#stat").textContent = `${w}×${h} · ${paths} paths · ${(svgText.length/1024).toFixed(1)} KB SVG${fileBytes?` (source ${(fileBytes/1024).toFixed(1)} KB)`:""} · ${(performance.now()-t0).toFixed(0)} ms${note}`;
    $("#dl").disabled = $("#cp").disabled = false;
  } catch (e) { $("#stat").textContent = "Error: " + e.message; }
}
document.querySelectorAll("input[type=range]").forEach(r => r.oninput = () => {
  $("#"+r.id+"v").textContent = r.value;
  if (r.id !== "maxdim" && !manual()) $("#preset").value = "detailed";
  schedule();
});
$("#seg").onchange = schedule;
$("#refine").onchange = $("#quality").onchange = schedule;
$("#stacked").onchange = $("#spline").onchange = () => { if (!manual()) $("#preset").value = "detailed"; schedule(); };

async function load(blob, name){
  src = await createImageBitmap(blob);
  fileBytes = blob.size; srcName = (name||"image").replace(/\.[^.]+$/,"");
  $("#src").src = URL.createObjectURL(blob);
  run();
}
$("#drop").onclick = () => $("#file").click();
$("#file").onchange = e => e.target.files[0] && load(e.target.files[0], e.target.files[0].name);
for (const t of ["dragover","dragenter"]) addEventListener(t, e => { e.preventDefault(); $("#drop").classList.add("over"); });
for (const t of ["dragleave","drop"]) addEventListener(t, e => { e.preventDefault(); $("#drop").classList.remove("over"); });
addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) load(f, f.name); });
addEventListener("paste", e => { const f = [...e.clipboardData.files][0]; if (f) load(f, f.name); });
$("#dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([svgText],{type:"image/svg+xml"})); a.download = srcName + ".svg"; a.click(); };
$("#cp").onclick = () => navigator.clipboard.writeText(svgText);

let drag = false;
const setSplit = x => { const r = $("#view").getBoundingClientRect(), p = Math.min(100,Math.max(0,(x-r.left)/r.width*100)); $("#bar").style.left = p+"%"; $("#svgwrap").style.clipPath = `inset(0 0 0 ${p}%)`; };
$("#bar").onpointerdown = e => { drag = true; e.target.setPointerCapture(e.pointerId); };
$("#bar").onpointermove = e => drag && setSplit(e.clientX);
$("#bar").onpointerup = () => drag = false;
$("#view").onpointerdown = e => { if (e.target.id !== "bar") setSplit(e.clientX); };
window.__victor = {load};
</script>
</body>
</html>
