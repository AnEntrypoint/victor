[package]
name = "png2svg-core"
version = "0.1.0"
edition = "2021"
authors = ["Open Vectorizer Contributors"]
license = "MIT"
repository = "https://github.com/vardirhq/open-vectorizer"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["decode"]
decode = [
    "image/png",
    "image/jpeg",
    "image/gif",
    "image/ico",
    "image/bmp",
    "image/pnm",
    "image/tga",
    "image/tiff",
]

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
wasm-bindgen = "0.2"
